<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyDigiRoom</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <script src="js/signed_out_header_init.js"></script>
    <div id="insert_header">
        <h1>Header Loading</h1>
    </div>
    <script>set_header("Log In");</script>

    <div class="container">
        <div class="left_of_log_in">
            <img src = images/bigcat.png alt="Big Cat">
        </div>
        <div class="log_in">
            <img src="images/logo.png" alt="Logo">
            <div class="log_in_placement">
                <input type="text" class="log_in_text" id="username" placeholder="Username or Email">
            </div>
            <div class="log_in_placement">
                <input type="text" class="log_in_text" id="password" placeholder="Password">
            </div>
            <div class="log_in_placement">
                <button class="log_in_button" type="button" onclick="login()">Log In</button>
                    <p id="error" style="color: red"></p>
            </div>
            <a href="sign_up.html">
                <div class="log_in_placement">
                    <button class="sign_up_button" type="button">Sign Up Here!</button>
                </div>
            </a>
        </div>
    </div>

<script src="js/log_in.js"></script>
</body>

</html>
