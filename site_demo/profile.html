<!DOCTYPE html>
<html lang="en">

<head>
    <title>My Profile</title>
    <link rel="stylesheet" href="css/main.css">
    <!--personal note: rel=type of file, href=where file is -->
    <!--
    -->
</head>

<body>
    <script src="js/header_init.js"></script>
    <div id="insert_header">
        <h1>Header Loading</h1>
    </div>
    <script>set_header("My Profile");</script>

    <main class="prof-sett-page">
        <div class="prof-sett-content">
            <aside class="prof-sett-sidebar">
                <div>
                    <button class="active">My Profile</button>
                    <a href="settings.html">
                        <button>Settings</button>
                    </a>
                </div>
                <a href="log_in.html"> <!---need to actually make it do something eventually-->
                    <button class="logout">Logout</button>
                </a>
            </aside>

            <section class="prof-sett-main">
                <h1>My Profile</h1>

                <div class="profile-top">
                    <div class="avatar"></div>
                    <p>Hello [name]!</p>
                </div>

                <div class="profile-form">
                    <input type="text" placeholder="Email Address">
                    <input type="text" placeholder="Name">
                    <input type="text" placeholder="Username">
                    <input type="password" placeholder="Change Password">
                </div>
            </section>
        </div>

    </main>
</body>

</html>
