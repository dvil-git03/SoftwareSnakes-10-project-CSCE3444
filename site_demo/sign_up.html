<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyDigiRoom</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <div class="container">
        <div class="left_of_log_in">
            <img src = "images/bigcat.png" alt="Big Cat">
        </div>
        <div class="log_in">
            <img src="images/logo.png" alt="Logo">
            <div class="log_in_placement">
                <input type="text" class="log_in_text" id="email" placeholder="Email Address">
            </div>
            <div class="log_in_placement">
                <input type="text" class="log_in_text" id="Name" placeholder="Name">
            </div>
            <div class="log_in_placement">
                <input type="text" class="log_in_text" id="username" placeholder="Username">
            </div>
            <div class="log_in_placement">
                <input type="text" class="log_in_text" id="password" placeholder="Password">
            </div>
            <a href="myroom.html">
            <div class="log_in_placement">
                <button class="sign_up_button" type="button">Sign Up</button>
            </div>                
            </a>

        </div>
    </div>

</body>

</html>
