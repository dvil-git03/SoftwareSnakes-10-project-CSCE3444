<!DOCTYPE html>
<html lang="en">

<head>
    <title>Friends</title>
    <link rel="stylesheet" href="css/main.css">
</head>

<body>
    <script src="js/header_init.js"></script>
    <div id="insert_header">
        <h1>Header Loading</h1>
    </div>
    <script>set_header("Friends");</script>

    <div class="friends_main">
        <div class="friends_container">
            <div class="friends_left">
                <div class="friends_header">Friends</div>

                <div class="no_friends"> 
                    <p>No friends yet!</p>
                </div>
            </div>
            <div class="friends_right">
                <input type="text" placeholder="Search for friends" class="friends_search">
                <div class="friends_messaging">
                    <h3>Messaging</h3>
                    <p style="font-size: 12px;">Check back for a messaging update!</p>
                </div>
            </div>
        </div>
        <div class="friends_footer"></div>
    </div>
