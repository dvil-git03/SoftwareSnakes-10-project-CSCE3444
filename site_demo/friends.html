<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyDigiRoom - Friends</title>
    <link rel="stylesheet" href="css/main.css">
</head>

<body>
    <script src="js/header_init.js"></script>
    <div id="insert_header">
        <h1>Header Loading</h1>
    </div>
    <script>setHeader("Friends");</script>

    <div class="friends-room-container">

        <!-- Separated relevant friends section (header, 
    search, no friends) into relevant style classes -->

        <div class="friends-header">
            <div class="friends-title">
                Friends
            </div>

            <input type="text" placeholder="Search for friends" class="friends-search">
        </div>

        <p class="no-friends">No friends yet!</p>
    </div>
