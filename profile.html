<!DOCTYPE html>
<html lang="en">
<head>
    <title>My Profile</title>
    <link rel="stylesheet" href="styles.css">
    <!--personal note: rel=type of file, href=where file is -->
    <!--
    -->
</head>

<body>

    <header class="topbar">
    <div class="mydigiroom-left">MyDigiRoom</div>
    <div class="icons">
        <span class="navbar-icons">🏠︎</span>
        <span class="navbar-icons">🌏︎</span>
        <span class="navbar-icons">㋡</span>
        <span class="navbar-icons">🗣</span>
    </div>
   </header>

    <main class="page">
        <div class="content">
            <aside class="sidebar">
                <div>
                    <button class="active">My Profile</button>
                    <button>Settings</button>
                </div>
                <button class="logout">Logout</button>
            </aside>

            <section class="profile-settings-main">
                <h1>My Profile</h1>

                <div class="profile-top">
                    <div class = "avatar"></div>
                    <p>Hello [name]!</p>
                </div>

                <div class ="form">
                    <input type="text" placeholder="Email Address">
                    <input type="text" placeholder="Name">
                    <input type="text" placeholder="Username">
                    <input type="password" placeholder="Change Password">
                </div>
            </section>
        </div>

    </main>


</body>
</html>
