<!DOCTYPE html>
<html lang="en">
<head>
    <title>Friends</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

     <header class="topbar">
    <div class="mydigiroom-left">
        <img src="topbarlogo.png" alt="MyDigiRoom Logo" class="topbar-logo">
        <span>MyDigiRoom</span>
    </div>
    <div class="icons">
        <span class="navbar-icons">🏠︎</span>
        <span class="navbar-icons">🌏︎</span>
        <span class="navbar-icons">㋡</span>
        <span class="navbar-icons">🗣</span>
    </div>
   </header>

<div class="friends-room-container">

    <!-- Separated relevant friends section (header, 
    search, no friends) into different style classes -->

    <div class="friends-header">
        <div class="friends-title">
            Friends ⍩
        </div>

    <input type="text" placeholder="Search for friends" class="friends-search">
    </div>

    <p class="no-friends">No friends yet!</p>
</div>
