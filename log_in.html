<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyDigiRoom - Login</title>
    <link rel="stylesheet" href="css/main.css">
</head>

<body>
    <div class="container">
        <div class="left-of-log-in">
            <img src=images/bigcat.png alt="Big Cat">
        </div>
        <div class="log-in">
            <img src="images/logo.png" alt="Logo">
            <div class="log-in-placement">
                <input type="text" class="log-in-text" id="username" placeholder="Username or Email">
            </div>
            <div class="log-in-placement">
                <input type="text" class="log-in-text" id="password" placeholder="Password">
            </div>
            <div class="log-in-placement">
                <button class="log-in-button" type="button" onclick="login()">Log In</button>
                <p id="error" style="color: red"></p>
            </div>
        </div>
    </div>

    <script src="js/log_in.js"></script>
</body>

</html>
