<!DOCTYPE html>
<html lang="en">

<head>
    <title>My Room</title>
    <link rel="stylesheet" href="css/main.css">
</head>


<body>
    <script src="js/header_init.js"></script>
    <div id="insert_header">
        <h1>Header Loading</h1>
    </div>
    <script>set_header("My Room");</script>


    <main> 
        <div class="room_edit_notice">⚠️ Notice ⚠️</div>
        <div class="room_container">
            <!-- all 3 walls of the room -->
            <div class="room_centerpoint">
                <div class="room_wall left_wall" wallpaper=""></div>
                <div class="room_wall right_wall" wallpaper=""></div>
                <div class="room_wall floor" wallpaper=""></div>
            </div>

            <!-- side menue is the entier menu on the left side of the screen -->
            <div class="side_menu">
                <!-- creates the class tab_container so then each tab will have the same formatting -->
                <!-- tab container will also be used for a click event to check and see which tab has been clicked to change the actual stuff in the menu -->
                <div class="tab_container">
                    <div class="item_tab" id="Wallpaper/Flooring">Wallpaper/Flooring</div>
                    <div class="item_tab" id="Items">Items</div>
                </div>

                <div class="item_list" id="Wallpaper/Flooring">
                    <img id="blue_stripes.jpeg" object-fit="cover" height="50px" width="50px" src="images/room_editing/wallpapers/blue_stripes.jpeg" alt="blue_stripes">
                    <img id="colorful_doodles.jpeg" object-fit="cover" height="50px" width="50px" src="images/room_editing/wallpapers/colorful_doodles.jpeg" alt="colorful_doodles">
                    <img id="brown_wood.jpeg" object-fit="cover" height="50px" width="50px" src="images/room_editing/wallpapers/brown_wood.jpeg" alt="brown_wood">    
                </div>
                <div class="item_list" id="Items">
                    <img id="basketball.png" object-fit="cover" height="50px" width="50px" src="images/room_editing/items/basketball.png" alt="basketball">        
                    <img id="clay_pot.png" object-fit="cover" height="50px" width="50px" src="images/room_editing/items/clay_pot.png" alt="clay_pot">        
                    <img id="crystal.png" object-fit="cover" height="50px" width="50px" src="images/room_editing/items/crystal.png" alt="crystal">        
                </div>
            
            </div>
            <div class="edit_menu">
                <h3 id="edit_menu_item_selected">SELECTED</h3>
                    <div id="rotation_container" vertical-align="middle">
                        <img id="rotate_right" object-fit="cover" height="50px" width="50px" src="images/room_editing/rotate-right-variant.svg" alt="rotate right">
                        Rotate Image
                        <img id="rotate_left" object-fit="cover" height="50px" width="50px" src="images/room_editing/rotate-left-variant.svg" alt="rotate left">
                    </div>
            </div>
        </div>
    </main>
    <script src="js/myroom_customization.js"></script>
</body>
